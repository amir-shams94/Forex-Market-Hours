<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forex Market Hours</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <img class="brand-logo-img" src="../icons/icon128.png" alt="Forex Market Hours" />
          <div class="brand-text">
            <h1>Forex Market Hours</h1>
            <p id="utc-clock" class="utc-clock">--:-- UTC</p>
            <p id="user-clock" class="user-clock" title="Your Windows timezone"></p>
          </div>
        </div>
        <div class="header-actions">
          <button id="time-swap-btn" class="icon-btn time-swap-btn" type="button"
                  title="Swap Forex session vs Exchange hours" aria-label="Swap Forex session vs Exchange hours" data-format="fx">
            <svg class="swap-icon" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="swapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="55%" stop-color="#2dd4bf" />
                  <stop offset="100%" stop-color="#34d399" />
                </linearGradient>
              </defs>
              <circle cx="12" cy="12" r="8.5" fill="rgba(45,212,191,0.08)" stroke="url(#swapGrad)" stroke-width="1.4" />
              <path d="M12 8v4.2l2.6 1.5" fill="none" stroke="url(#swapGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M7.5 15.5h5.2M10.2 13.3l-2.7 2.2 2.7 2.2" fill="none" stroke="url(#swapGrad)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M16.5 8.5h-5.2M13.8 10.7l2.7-2.2-2.7-2.2" fill="none" stroke="url(#swapGrad)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="swap-badge" id="swap-badge">FX</span>
          </button>
          <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0  0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </div>
      <div id="market-change-banner" class="market-change-banner" hidden role="status">
        <span class="change-pulse" aria-hidden="true"></span>
        <span id="market-change-text" class="market-change-text"></span>
      </div>
      <div id="format-toast" class="format-toast" hidden role="status"></div>
      <div class="summary" id="summary">
        <span class="pulse" aria-hidden="true"></span>
        <span id="summary-text">Loading markets…</span>
      </div>
      <div id="sim-banner" class="sim-banner" hidden>
        <span class="sim-icon" aria-hidden="true">⏱️</span>
        <span class="sim-label">
          Time-travel mode
          <strong id="sim-time-label">—</strong>
        </span>
        <button id="sim-reset-btn" class="sim-reset" type="button">Reset</button>
      </div>
    </header>

    <main id="markets" class="markets" aria-live="polite"></main>

    <div id="empty-state" class="empty-state hidden">
      <p>No markets selected.</p>
      <button id="empty-open-options" class="primary">Add markets</button>
    </div>

    <footer class="footer">
      <span class="footer-left">
        <span id="data-source">Local engine</span>
      </span>
      <a id="open-options" href="#">Manage markets</a>
    </footer>
    <div class="credit">
      Powered by
      <a href="mailto:amirreza.sh94@gmail.com">amirreza.sh94@gmail.com</a>
    </div>

    <template id="market-card-tpl">
      <article class="market-card" data-id="">
        <div class="card-main">
          <div class="card-left">
            <span class="flag" aria-hidden="true"></span>
            <span class="status-dot" aria-hidden="true"></span>
          </div>
          <div class="card-body">
            <div class="row-1">
              <h2 class="market-name"></h2>
              <span class="status-label"></span>
            </div>
            <div class="row-2">
              <span class="local-time"></span>
              <span class="local-day"></span>
            </div>
            <div class="row-3">
              <span class="countdown-label"></span>
              <span class="countdown-value"></span>
            </div>
            <div class="row-4 muted">
              <span class="hours-range"></span>
            </div>
          </div>
          <div class="card-map" aria-hidden="true"></div>
        </div>
        <div class="holiday-banner" hidden>
          <span class="holiday-icon" aria-hidden="true">🏛️</span>
          <span class="holiday-text"></span>
        </div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
